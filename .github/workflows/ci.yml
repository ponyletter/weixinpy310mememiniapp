name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      JWT_SECRET: test-only-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check .
      - name: Test backend
        working-directory: backend
        run: python -m pytest -q
      - name: Check mini program JavaScript syntax
        run: |
          find miniapp backend/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
